scope_note: >
  Models EU AI Act Article 26(2). Denies use of the external analytics tool
  on a high-risk-classified output (per SHIELD-AIACT-ANNEXIII) unless a
  named, competent human overseer has been assigned to the call. Does not
  model Article 26's other deployer duties (input data quality, monitoring,
  log retention); left as roadmap.
decision: deny
