agent_control_specification_version: "0.3.1-beta"
metadata:
  name: shield-gdpr-022-fall-risk
policies:
  gdpr_art22_policy:
    type: rego
    bundle: ./policy
    query: data.shield_gdpr_022.verdict
intervention_points:
  pre_tool_call:
    policy_target: "$.tool_call.args"
    policy_target_kind: tool_args
    tool_name_from: "$.tool_call.name"
    policy:
      id: gdpr_art22_policy
  post_tool_call:
    policy_target: "$.tool_result"
    policy_target_kind: tool_result
    tool_name_from: "$.tool_call.name"
    policy:
      id: gdpr_art22_policy
tools:
  get_patient_record:
    type: Tool
    id: get_patient_record
    clearance: internal
  get_fall_risk:
    type: Tool
    id: get_fall_risk
    clearance: internal